<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Ghorer Bazar Fashion</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        .product-page-wrapper {
            padding: 40px 15px 80px 15px;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        .premium-gallery { display: flex; flex-direction: row-reverse; gap: 20px; height: 500px; }
        .main-img-box { flex: 1; border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; }
        .main-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .thumb-box { width: 90px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .thumb-box::-webkit-scrollbar { width: 0; } 
        
        .thumb-img { width: 100%; height: 90px; border-radius: 8px; border: 2px solid transparent; overflow: hidden; cursor: pointer; flex-shrink: 0; background: #fff; transition: 0.3s;}
        .thumb-img img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-img.active { border-color: var(--text-main); }
        .thumb-img:hover { filter: brightness(0.9); }

        .info-panel { display: flex; flex-direction: column; }
        .cat-name { color: var(--text-muted); text-transform: uppercase; font-size: 0.85rem; font-weight: 600; letter-spacing: 1px;}
        .title { font-size: 2rem; font-weight: 700; margin: 10px 0; color: var(--text-main); line-height: 1.3;}
        
        .price-row { display: flex; align-items: baseline; gap: 15px; margin-bottom: 30px; }
        .price { font-size: 2.2rem; font-weight: 700; color: var(--primary-color); }
        .old-price { font-size: 1.2rem; text-decoration: line-through; color: var(--text-muted); }

        .variant-box { margin-bottom: 25px; }
        .variant-box label { display: block; font-weight: 600; margin-bottom: 12px; font-size: 1rem;}
        .variant-list { display: flex; flex-wrap: wrap; gap: 12px; }
        
        .select-btn { border: 2px solid #e0e0e0; background: #fff; padding: 10px 22px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 1.05rem; }
        .select-btn:hover:not(.disabled) { border-color: var(--text-main); }
        .select-btn.active { background: var(--text-main); color: #fff; border-color: var(--text-main); }
        .select-btn.disabled { background: #f9f9f9; color: #c4c4c4; border-color: #eee; cursor: not-allowed; text-decoration: line-through; }
        
        .color-btn { border-radius: 30px; } 

        .status-msg { margin-bottom: 25px; font-size: 0.95rem; font-weight: 500; display: inline-flex; align-items: center; gap: 10px; padding: 10px 15px; border-radius: 8px; background: rgba(46, 125, 50, 0.1); color: var(--primary-color); border: 1px dashed var(--primary-light);}
        
        .action-flex { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;}
        .qty-controls { display: flex; align-items: center; border: 2px solid #e0e0e0; border-radius: 8px; height: 55px; background: #fff;}
        .qty-controls button { width: 50px; background: transparent; border: none; font-size: 1.5rem; cursor: pointer; font-weight: bold;}
        .qty-controls input { width: 50px; text-align: center; border: none; font-weight: bold; font-size: 1.2rem; outline: none;}

        .btn-add { flex: 1; border: 2px solid var(--text-main); color: var(--text-main); background: #fff; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 1.1rem;}
        .btn-add:hover { background: var(--text-main); color: #fff; }
        
        .btn-buy { width: 100%; height: 55px; background: var(--primary-color); color: #fff; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: 0.3s;}
        .btn-buy:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3); }

        .desc-box { border-top: 1px solid var(--border-color); padding-top: 25px; margin-top: 30px; }
        .desc-box h4 { margin-bottom: 10px; font-size: 1.3rem; }
        .desc-box p { color: var(--text-muted); line-height: 1.8; font-size: 1rem; }

        @media(max-width: 992px){
            .product-page-wrapper { grid-template-columns: 1fr; gap: 20px; }
            .premium-gallery { flex-direction: column; height: auto; }
            .main-img-box { height: 400px; }
            .thumb-box { flex-direction: row; height: auto; width: 100%;}
            .action-flex { flex-direction: column; }
            .qty-controls { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <!-- Header Panel -->
    <header class="header">
        <div class="container navbar">
            <div class="logo"><a href="index.html"><h2>Ghorer<span>Bazar</span></h2></a></div>
            <div class="nav-icons">
                <a href="cart.html" class="icon-link"><i class="fas fa-shopping-bag"></i></a>
            </div>
        </div>
    </header>

    <!-- Page Content Container -->
    <main class="container">
        
        <div id="loading-box" style="text-align: center; padding: 100px 0; color: var(--text-muted);">
            <i class="fas fa-spinner fa-spin" style="font-size: 3rem;"></i>
        </div>

        <div class="product-page-wrapper" id="content-box" style="display: none;">
            
            <!-- Product Gallery -->
            <div class="premium-gallery">
                <div class="main-img-box">
                    <img id="main-image" src="" alt="Main Fashion Display">
                </div>
                <div class="thumb-box" id="thumb-container"></div>
            </div>

            <!-- Details Panel -->
            <div class="info-panel">
                <div class="cat-name" id="product-cat">CLOTHING</div>
                <h1 class="title" id="product-title">Loading...</h1>
                
                <div class="price-row">
                    <span class="price" id="product-price">৳0</span>
                    <span class="old-price" id="product-oldPrice" style="display:none;">৳0</span>
                </div>

                <!-- Colors Selection -->
                <div class="variant-box">
                    <label>Choose Color:</label>
                    <div class="variant-list" id="color-options"></div>
                </div>

                <!-- Sizes Selection -->
                <div class="variant-box">
                    <label>Select Size:</label>
                    <div class="variant-list" id="size-options"></div>
                </div>

                <div class="status-msg" id="stock-notice">
                    <i class="fas fa-info-circle"></i> Please select Color & Size.
                </div>

                <!-- Add to Cart / Order Area -->
                <div class="action-flex">
                    <div class="qty-controls">
                        <button id="btn-minus">-</button>
                        <input type="number" id="qty-input" value="1" readonly>
                        <button id="btn-plus">+</button>
                    </div>
                    <button class="btn-add" id="btn-add-cart">Add To Bag</button>
                </div>
                <button class="btn-buy" id="btn-buy-now">Order Now</button>

                <!-- Description -->
                <div class="desc-box">
                    <h4>Description</h4>
                    <p id="product-desc"></p>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/product.js"></script>
</body>
</html>
