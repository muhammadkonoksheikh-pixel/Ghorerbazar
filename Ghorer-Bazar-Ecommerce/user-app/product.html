<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Ghorer Bazar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .product-details-section { padding: 40px 0; }
        .product-main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 50px; }
        
        /* Gallery */
        .product-gallery { display: flex; flex-direction: column; gap: 15px; }
        .main-img-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius); overflow: hidden; height: 400px; display: flex; justify-content: center; align-items: center; position: relative; }
        .main-img-container img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: crosshair; transition: transform 0.3s; }
        .main-img-container img:hover { transform: scale(1.5); }
        
        .thumb-gallery { display: flex; gap: 10px; }
        .thumb-item { width: 80px; height: 80px; border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; overflow: hidden; }
        .thumb-item.active { border-color: var(--primary-color); }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; }

        /* Info */
        .product-info-wrap { display: flex; flex-direction: column; }
        .product-category-label { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .product-title-large { font-size: 2rem; font-weight: 700; color: var(--text-main); margin-bottom: 15px; line-height: 1.2; }
        
        .price-wrap { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .price-new { font-size: 2rem; font-weight: 700; color: var(--primary-color); }
        .price-old { font-size: 1.2rem; text-decoration: line-through; color: var(--text-muted); }
        .discount-badge { background: var(--danger); color: var(--white); padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 0.9rem; }

        .product-short-desc { color: var(--text-muted); margin-bottom: 25px; line-height: 1.6; }

        .action-area { display: flex; gap: 20px; align-items: center; margin-bottom: 30px; }
        .qty-selector { display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; height: 45px; }
        .qty-selector button { background: var(--bg-main); border: none; width: 45px; height: 100%; font-size: 1.2rem; cursor: pointer; transition: var(--transition); }
        .qty-selector button:hover { background: var(--border-color); }
        .qty-selector input { width: 50px; height: 100%; border: none; text-align: center; font-weight: 600; font-size: 1.1rem; outline: none; }
        
        .btn-add, .btn-buy { height: 45px; flex: 1; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: var(--transition); display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-add { background: var(--white); border: 2px solid var(--primary-color); color: var(--primary-color); }
        .btn-add:hover { background: rgba(46, 125, 50, 0.1); }
        .btn-buy { background: var(--primary-color); color: var(--white); }
        .btn-buy:hover { background: var(--primary-dark); }
        .btn-wishlist-large { width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1.2rem; color: var(--text-muted); cursor: pointer; transition: var(--transition); background: var(--white); }
        .btn-wishlist-large:hover { color: var(--danger); border-color: var(--danger); }

        /* Description Tabs */
        .desc-tabs { border-bottom: 1px solid var(--border-color); display: flex; gap: 30px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 0; background: none; border: none; font-size: 1.1rem; font-weight: 600; color: var(--text-muted); cursor: pointer; position: relative; }
        .tab-btn.active { color: var(--primary-color); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 3px; background: var(--primary-color); }
        
        .tab-content { display: none; color: var(--text-main); line-height: 1.8; }
        .tab-content.active { display: block; animation: fadeIn 0.5s; }

        @media (max-width: 768px) {
            .product-main-grid { grid-template-columns: 1fr; gap: 20px; }
            .action-area { flex-wrap: wrap; }
            .btn-add, .btn-buy { flex: 100%; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <div class="logo"><a href="index.html"><h2>Ghorer<span>Bazar</span></h2></a></div>
            <div class="nav-icons">
                <a href="cart.html" class="icon-link"><i class="fas fa-shopping-cart"></i></a>
            </div>
        </div>
    </header>

    <main class="container product-details-section">
        
        <div id="product-loading" style="text-align:center; padding: 50px; font-size: 1.2rem; color: var(--primary-color);">
            <i class="fas fa-spinner fa-spin"></i> Loading Product...
        </div>

        <div id="product-content" style="display: none;">
            <div class="product-main-grid">
                <!-- Gallery -->
                <div class="product-gallery">
                    <div class="main-img-container">
                        <img id="main-image" src="" alt="Product">
                    </div>
                    <div class="thumb-gallery" id="thumb-gallery">
                        <!-- Thumbs injected via JS -->
                    </div>
                </div>

                <!-- Info -->
                <div class="product-info-wrap">
                    <div class="product-category-label" id="pd-category">Category</div>
                    <h1 class="product-title-large" id="pd-title">Product Name</h1>
                    
                    <div class="price-wrap">
                        <span class="price-new" id="pd-price">৳0</span>
                        <span class="price-old" id="pd-old-price" style="display: none;">৳0</span>
                        <span class="discount-badge" id="pd-discount" style="display: none;">-0%</span>
                    </div>

                    <p class="product-short-desc" id="pd-short-desc">Loading description...</p>
                    <p style="margin-bottom: 20px;"><strong>Availability:</strong> <span id="pd-stock" style="color:var(--success); font-weight:bold;">In Stock</span></p>

                    <div class="action-area">
                        <div class="qty-selector">
                            <button id="pd-qty-minus">-</button>
                            <input type="text" id="pd-qty-input" value="1" readonly>
                            <button id="pd-qty-plus">+</button>
                        </div>
                        <button class="btn-add" id="btn-add-to-cart"><i class="fas fa-cart-plus"></i> Add to Cart</button>
                        <button class="btn-wishlist-large" id="btn-wishlist"><i class="fas fa-heart"></i></button>
                    </div>
                    
                    <button class="btn-buy" id="btn-buy-now"><i class="fas fa-bolt"></i> Buy Now</button>
                </div>
            </div>

            <!-- Description Tabs -->
            <div class="desc-tabs">
                <button class="tab-btn active" data-target="tab-desc">Description</button>
                <button class="tab-btn" data-target="tab-reviews">Reviews (0)</button>
            </div>
            
            <div class="tab-content active" id="tab-desc">
                <!-- Full description injected here -->
            </div>
            
            <div class="tab-content" id="tab-reviews">
                <p>No reviews yet. Be the first to review this product!</p>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/product.js"></script>
    <script>
        // Tab switching logic
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });
    </script>
</body>
</html>
