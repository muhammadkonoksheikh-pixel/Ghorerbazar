<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Premium Fashion</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .product-page-wrapper { padding: 40px 15px 80px 15px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
        .premium-gallery { display: flex; flex-direction: row-reverse; gap: 20px; height: 500px; }
        .main-img-box { flex: 1; border-radius: 12px; overflow: hidden; background: #fff; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02);}
        .main-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .thumb-box { width: 90px; height: 100%; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .thumb-box::-webkit-scrollbar { width: 0; } 
        .thumb-img { width: 100%; height: 90px; border-radius: 8px; border: 2px solid transparent; overflow: hidden; cursor: pointer; flex-shrink: 0; background: #fff; transition: 0.3s;}
        .thumb-img img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-img.active { border-color: var(--text-main); }
        .thumb-img:hover { filter: brightness(0.9); }

        .info-panel { display: flex; flex-direction: column; }
        .cat-name { color: var(--text-muted); text-transform: uppercase; font-size: 0.85rem; margin-bottom: 5px; font-weight: 600; letter-spacing: 1px;}
        .title { font-size: 2.2rem; font-weight: 700; margin-bottom: 15px; color: var(--text-main); line-height: 1.3;}
        
        .price-row { display: flex; align-items: baseline; gap: 15px; margin-bottom: 30px; }
        .price { font-size: 2.2rem; font-weight: 700; color: var(--primary-color); }
        .old-price { font-size: 1.2rem; text-decoration: line-through; color: var(--text-muted); }
        .discount-badge { background: #ff4757; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 0.9rem; font-weight: 600;}

        .variant-box { margin-bottom: 25px; }
        .variant-box label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 12px; font-size: 1rem; color: var(--text-main);}
        .selected-value { color: var(--text-muted); font-size: 0.9rem; font-weight: 500;}
        .variant-list { display: flex; flex-wrap: wrap; gap: 12px; }
        
        .select-btn { border: 2px solid #e0e0e0; background: #fff; padding: 10px 22px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; color: var(--text-main); font-size: 1.05rem; }
        .select-btn:hover:not(.out-of-stock) { border-color: var(--text-main); }
        .select-btn.active { background: var(--text-main); color: #fff; border-color: var(--text-main); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .select-btn.out-of-stock { background: #f9f9f9; color: #c4c4c4; border-color: #eee; cursor: not-allowed; text-decoration: line-through; }
        .color-btn { border-radius: 30px; padding: 8px 25px; }

        .status-msg { margin-bottom: 25px; font-size: 0.95rem; font-weight: 500; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 8px; background: #f8f9fa; border: 1px dashed #ddd;}

        .action-flex { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;}
        .qty-controls { display: flex; align-items: center; border: 2px solid #e0e0e0; border-radius: 8px; height: 55px; background: #fff;}
        .qty-controls button { width: 50px; background: transparent; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-main); font-weight: bold;}
        .qty-controls input { width: 50px; text-align: center; border: none; font-weight: bold; font-size: 1.2rem; outline: none; background: transparent; color: var(--text-main);}

        .btn-add { flex: 1; border: 2px solid var(--text-main); color: var(--text-main); background: #fff; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 1.1rem;}
        .btn-add:hover { background: var(--text-main); color: #fff; }
        
        .btn-buy { width: 100%; height: 55px; background: var(--primary-color); color: #fff; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .btn-buy:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3); }

        .desc-box { border-top: 1px solid var(--border-color); padding-top: 25px; margin-top: 30px; }
        .desc-box h4 { margin-bottom: 10px; font-size: 1.3rem; color: var(--text-main);}
        .desc-box p { color: var(--text-muted); line-height: 1.8; font-size: 1rem; }

        @media(max-width: 992px){
            .product-page-wrapper { grid-template-columns: 1fr; padding-top: 20px; gap: 20px; }
            .premium-gallery { flex-direction: column; height: auto; }
            .main-img-box { width: 100%; height: 450px; border-radius: 12px; }
            .thumb-box { width: 100%; height: auto; flex-direction: row; }
            .thumb-img { width: 80px; height: 80px; }
            .title { font-size: 1.6rem; margin-bottom: 10px;}
            .price { font-size: 1.8rem; }
            .qty-controls { width: 100%; justify-content: space-between; }
            .qty-controls button { width: 60px;}
            .qty-controls input { flex:1; }
            .btn-add { height: 55px; }
            .btn-add, .btn-buy, .qty-controls { flex-basis: 100%; } 
            body { padding-bottom: 60px; } 
        }
        @media(max-width: 480px) {
            .main-img-box { height: 350px; }
            .thumb-img { width: 70px; height: 70px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <div class="logo"><a href="index.html"><h2>Ghorer<span>Bazar</span></h2></a></div>
            <div class="nav-icons">
                <a href="cart.html" class="icon-link">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cart-badge" class="badge" style="display:none;">0</span>
                </a>
            </div>
        </div>
    </header>

    <div id="loading-ui" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:60vh; color: var(--text-muted);">
        <i class="fas fa-circle-notch fa-spin" style="font-size: 3rem; margin-bottom: 20px; color: var(--primary-color);"></i>
        <h3>Unfolding Latest Collection...</h3>
    </div>

    <div class="product-page-wrapper" id="content-ui" style="display: none;">
        <div class="premium-gallery">
            <div class="main-img-box"><img id="main-image" src="" alt="Main Fashion Display"></div>
            <div class="thumb-box" id="thumb-container"></div>
        </div>

        <div class="info-panel">
            <div class="cat-name" id="product-category">LATEST COLLECTION</div>
            <h1 class="title" id="product-title">Loading...</h1>
            
            <div class="price-row">
                <span class="price" id="product-price">৳0</span>
                <span class="old-price" id="product-old-price" style="display:none;">৳0</span>
                <span class="discount-badge" id="product-discount" style="display:none;">Sale!</span>
            </div>

            <div class="variant-box">
                <label>Color Options <span class="selected-value" id="disp-color-select">Not Selected</span></label>
                <div class="variant-list" id="color-options"></div>
            </div>

            <div class="variant-box">
                <label>Available Sizes <span class="selected-value" id="disp-size-select">Not Selected</span></label>
                <div class="variant-list" id="size-options"></div>
            </div>

            <div class="status-msg" id="stock-status">
                <i class="fas fa-bell"></i> Pick a combination to view live warehouse stock limit.
            </div>

            <div class="action-flex">
                <div class="qty-controls">
                    <button id="qty-minus"><i class="fas fa-minus" style="font-size:1rem;"></i></button>
                    <input type="number" id="qty-val" value="1" readonly>
                    <button id="qty-plus"><i class="fas fa-plus" style="font-size:1rem;"></i></button>
                </div>
                <!-- Add to bag button -->
                <button class="btn-add" id="btn-cart"><i class="fas fa-shopping-bag"></i> ADD TO BAG</button>
            </div>
            
            <!-- BUY NOW BUTTON UPDATED FOR HIGH CONVERSION -->
            <button class="btn-buy" id="btn-buy"><i class="fas fa-bolt"></i> BUY NOW</button>

            <div class="desc-box">
                <h4>Fabric & Description</h4>
                <p id="product-desc"></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/product.js"></script>
</body>
</html>
