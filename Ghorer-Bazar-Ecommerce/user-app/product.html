<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Details | Official Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Specific Premium Clothing Brand Page Styling -->
    <style>
        .p-detail-container { padding: 40px 0; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 55% 45%; gap: 60px;}

        /* Fast Image Layout - Big Fashion Pictures */
        .image-col { display: flex; flex-direction: row-reverse; gap: 20px; position: sticky; top: 80px; height: calc(100vh - 120px);}
        .main-img-wrap { flex: 1; border-radius: var(--border-radius); background: #f4f4f4; overflow: hidden;}
        .main-img-wrap img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
        
        .thumb-list { width: 80px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto;}
        .thumb-list::-webkit-scrollbar { width: 4px; }
        .thumb-item { height: 100px; border-radius: 4px; overflow: hidden; opacity: 0.5; transition: 0.3s; cursor: pointer; border: 1px solid #ddd;}
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
        .thumb-item.active, .thumb-item:hover { opacity: 1; border-color: var(--primary-color);}

        /* Information Column */
        .info-col { padding: 10px 0;}
        .breadcrumb { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; font-weight: 500;}
        .product-title { font-size: 2rem; font-weight: 700; color: var(--primary-color); line-height: 1.2; margin-bottom: 10px; letter-spacing: -0.5px;}
        .product-pricing { display: flex; align-items: baseline; gap: 15px; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px;}
        .price { font-size: 2.2rem; font-weight: 700;}
        .price-old { text-decoration: line-through; color: var(--text-muted); font-size: 1.2rem;}

        /* Colors Custom Select */
        .attr-box { margin-bottom: 25px; }
        .attr-title { font-size: 0.95rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: flex; justify-content: space-between;}
        .color-list { display: flex; gap: 12px; flex-wrap: wrap; }
        .color-node { 
            padding: 10px 20px; font-size: 0.9rem; font-weight: 500; border: 1px solid var(--border-color); 
            border-radius: 40px; cursor: pointer; transition: 0.2s; color: var(--text-main); background: var(--bg-main);
        }
        .color-node:hover { border-color: var(--text-main); }
        .color-node.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

        /* Sizes Custom Select */
        .size-list { display: flex; gap: 12px; flex-wrap: wrap; }
        .size-node {
            width: 60px; height: 60px; border: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; background: var(--white);
        }
        .size-node:hover:not(.empty) { border-color: var(--primary-color); }
        .size-node.active { border-color: var(--primary-color); background: var(--primary-color); color: #fff; }
        .size-node.empty { background: #f5f5f5; color: #ddd; text-decoration: line-through; cursor: not-allowed; border-color: #f1f1f1;}
        
        .stock-txt { font-size: 0.9rem; color: #e74c3c; font-weight: 600;}

        /* Powerful Cart Actions Matrix */
        .interaction-matrix { margin-top: 40px; margin-bottom: 40px;}
        
        /* New Custom Minimal UI Buttons */
        .huge-cart-btn {
            width: 100%; display: flex; justify-content: center; align-items: center; gap: 15px;
            padding: 18px 0; background: var(--primary-color); color: #fff; border: none;
            font-size: 1.15rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: 0.3s; margin-bottom: 15px; position: relative; overflow: hidden;
        }
        .huge-cart-btn:hover { background: var(--text-main); box-shadow: 0 10px 20px rgba(0,0,0,0.15); transform: translateY(-2px);}
        
        /* Order Directly Checkout Outline Button */
        .checkout-direct-btn {
            width: 100%; padding: 18px 0; border: 1px solid var(--primary-color); background: #fff; color: var(--primary-color);
            font-size: 1rem; font-weight: 600; text-transform: uppercase; cursor: pointer; transition: 0.3s; letter-spacing: 1px;
        }
        .checkout-direct-btn:hover { background: #fafafa; }

        /* Delivery Features */
        .assurance-strip { display: flex; gap: 20px; margin-bottom: 30px; font-size: 0.85rem; color: var(--text-muted); font-weight: 500;}
        .assurance-strip i { margin-right: 5px; font-size: 1rem; color: var(--primary-color); }

        /* Core Fashion Descriptions */
        .collapse-accordion { border-top: 1px solid var(--border-color); padding-top: 30px;}
        .collapse-title { font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 1rem; margin-bottom: 15px;}
        .desc-text { color: #555; line-height: 1.9; font-size: 0.95rem; margin-bottom: 20px;}

        /* Heavy Mobility Optimizations */
        @media(max-width: 992px){
            .p-detail-container { grid-template-columns: 1fr; padding: 10px 15px 40px 15px; gap: 30px;}
            .image-col { flex-direction: column; position: relative; height: auto; top: 0; }
            .main-img-wrap { height: 50vh;} /* Dynamic view sizing */
            .thumb-list { flex-direction: row; width: 100%; overflow-x: auto;}
            .thumb-list::-webkit-scrollbar { height: 0;}
            .thumb-item { flex: 0 0 70px; height: 90px;}
            .interaction-matrix {
                position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; z-index: 100;
                padding: 15px; margin: 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); border-top: 1px solid var(--border-color); display: flex; gap:10px;
            }
            .huge-cart-btn, .checkout-direct-btn { margin-bottom: 0; padding: 14px 0;}
            /* Push layout down */
            body { padding-bottom: 100px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <div class="logo"><a href="index.html"><h2>Ghorer<span>Bazar</span></h2></a></div>
            <div class="nav-icons"><a href="cart.html" class="icon-link"><i class="fas fa-shopping-bag"></i><span id="cart-badge" class="badge">0</span></a></div>
        </div>
    </header>

    <!-- App Initial Loader (Elegant) -->
    <div id="loader-display" class="loader-container">
        <div style="text-align: center; color: var(--primary-color);">
            <i class="fas fa-circle-notch fa-spin" style="font-size: 2.5rem; margin-bottom:15px;"></i>
            <h4 style="font-weight: 500; text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem;">Fetching Collection...</h4>
        </div>
    </div>

    <!-- MAIN PRODUCT DATA RENDER BODY -->
    <main class="container p-detail-container" id="product-container" style="display:none;">
        
        <!-- Imagery Rendering Gallery Module -->
        <div class="image-col">
            <div class="main-img-wrap">
                <img id="d-main-img" src="" alt="Cloth Render">
            </div>
            <!-- Custom Gallery Generated From Variants Below -->
            <div class="thumb-list" id="d-thumbs-inject"></div>
        </div>

        <!-- System & Choice Interfaces Module -->
        <div class="info-col">
            <div class="breadcrumb" id="d-category">Men's Premium T-Shirts</div>
            <h1 class="product-title" id="d-title">Title Empty</h1>
            
            <div class="product-pricing">
                <div class="price" id="d-price">৳0</div>
                <div class="price-old" id="d-old-price" style="display: none;">৳0</div>
            </div>

            <!-- NEW! Clothing Variant Color Choices Matrix-->
            <div class="attr-box">
                <div class="attr-title"><span>Available Colors</span> <span id="label-sel-col" style="color:var(--text-muted); font-weight:400; text-transform: capitalize;">Select Below</span></div>
                <div class="color-list" id="d-color-list"></div>
            </div>

            <!-- NEW! Clothing Sizes Mapping Choice Target Data Linked Limit Object  -->
            <div class="attr-box">
                <div class="attr-title"><span>Select Size</span> <span id="label-stock-live" class="stock-txt"></span></div>
                <div class="size-list" id="d-size-list">
                    <span style="font-size: 0.9rem; color: #888;">Select a color first...</span>
                </div>
            </div>

            <!-- Dynamic System Cart Handlers Buttons Mobile Action Base -->
            <div class="interaction-matrix">
                <button class="huge-cart-btn" id="d-add-cart">ADD TO BAG</button>
            </div>
            
            <!-- Extra info -->
            <div class="assurance-strip">
                <div><i class="fas fa-truck"></i> Express Delivery</div>
                <div><i class="fas fa-undo-alt"></i> 7-Days Easy Return</div>
            </div>

            <!-- Descriptions Component Display Render-->
            <div class="collapse-accordion">
                <div class="collapse-title">Product Details & Fabric</div>
                <div class="desc-text" id="d-description">Loading features...</div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/product.js"></script>
</body>
</html>
