<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Add head codes exactly like previous product.html but referencing your new CSS logic -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Ghorer Bazar Fashion</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .product-details-section { padding: 40px 0; }
        .product-main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 50px; }
        .main-img-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius); overflow: hidden; height: 500px; display: flex; justify-content: center; align-items: center;}
        .main-img-container img { width: 100%; height: 100%; object-fit: contain;}
        .thumb-gallery { display: flex; gap: 10px; margin-top:15px; }
        .thumb-item { width: 80px; height: 80px; border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; }
        .thumb-item.active { border-color: var(--primary-color); }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; }

        .product-info-wrap { display: flex; flex-direction: column; }
        .product-title-large { font-size: 2rem; font-weight: 700; color: var(--text-main); margin-bottom: 10px;}
        .price-wrap { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .price-new { font-size: 2rem; font-weight: 700; color: var(--primary-color); }
        .action-area { display: flex; gap: 15px; margin-bottom: 20px; align-items: stretch; }
        
        .qty-selector { display: flex; align-items: center; border: 1px solid var(--border-color); border-radius: 8px; height: 50px; }
        .qty-selector button { width: 45px; background: transparent; border: none; font-size:1.2rem; cursor:pointer;}
        .qty-selector input { width: 50px; border: none; text-align: center; font-weight: 700;}
        
        .btn-add { flex: 1; border: 2px solid var(--primary-color); color: var(--primary-color); font-weight: bold; background:#fff; border-radius:8px;}
        .btn-buy { width: 100%; height: 50px; border: none; background: var(--primary-color); color: #fff; font-weight: bold; border-radius:8px; font-size:1.1rem; cursor:pointer;}
        @media(max-width: 768px){ .product-main-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <div class="logo"><a href="index.html"><h2>Ghorer<span>Bazar</span></h2></a></div>
            <div class="nav-icons"><a href="cart.html" class="icon-link"><i class="fas fa-shopping-bag"></i></a></div>
        </div>
    </header>

    <main class="container product-details-section">
        
        <div id="product-loading" style="text-align:center; padding: 50px; font-size: 1.2rem;">
            <i class="fas fa-spinner fa-spin"></i> Retrieving Design...
        </div>

        <div id="product-content" style="display: none;">
            <div class="product-main-grid">
                
                <!-- Product Image Viewer -->
                <div>
                    <div class="main-img-container">
                        <img id="main-image" src="" alt="Product">
                    </div>
                    <div class="thumb-gallery" id="thumb-gallery"></div>
                </div>

                <!-- Product Information & Logic -->
                <div class="product-info-wrap">
                    <span class="product-details-subtitle" id="pd-category" style="color:var(--text-muted); font-size:0.9rem;">Apparel</span>
                    <h1 class="product-title-large" id="pd-title">Fashion Product</h1>
                    
                    <div class="price-wrap">
                        <span class="price-new" id="pd-price">৳0</span>
                    </div>

                    <!-- Size Selection Section -->
                    <span class="product-details-subtitle">Select Size:</span>
                    <div class="size-selector" id="size-options-container">
                        <!-- S, M, L will be built from js based on DB stock -->
                    </div>

                    <!-- Status Indicator showing live inventory data -->
                    <div class="stock-indicator" id="live-stock-text" style="color:var(--text-muted);">
                        Please select a size to view availability.
                    </div>

                    <!-- Description Mini -->
                    <p style="color: var(--text-muted); line-height:1.6; margin-bottom:20px;" id="pd-short-desc"></p>

                    <!-- Add & Cart Box -->
                    <div class="action-area">
                        <div class="qty-selector">
                            <button id="pd-qty-minus">-</button>
                            <input type="text" id="pd-qty-input" value="1" readonly>
                            <button id="pd-qty-plus">+</button>
                        </div>
                        <button class="btn-add" id="btn-add-to-cart"><i class="fas fa-shopping-bag"></i> Add To Bag</button>
                    </div>
                    
                    <button class="btn-buy" id="btn-buy-now"><i class="fas fa-bolt"></i> Order Now</button>
                </div>
            </div>

            <!-- Detail Tabs -->
            <div style="border-top:1px solid #ddd; margin-top:20px; padding-top:20px;" id="tab-desc">
                <!-- Full DB details mapped here -->
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/product.js"></script>
</body>
</html>
