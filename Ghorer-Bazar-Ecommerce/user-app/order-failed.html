<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Failed - Ghorer Bazar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .failed-container { min-height: 80vh; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .failed-card { background: var(--white); border-radius: 20px; box-shadow: var(--shadow-lg); padding: 50px 30px; text-align: center; max-width: 500px; width: 100%; border-top: 5px solid var(--danger); }
        .failed-icon { font-size: 5rem; color: var(--danger); margin-bottom: 20px; }
        .failed-card h2 { font-size: 2rem; color: var(--text-main); margin-bottom: 10px; }
        .failed-card p { color: var(--text-muted); margin-bottom: 30px; line-height: 1.6; }
        .action-btns { display: flex; flex-direction: column; gap: 15px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <div class="logo"><a href="index.html"><h2>Ghorer<span>Bazar</span></h2></a></div>
        </div>
    </header>

    <main class="failed-container">
        <div class="failed-card">
            <i class="fas fa-times-circle failed-icon"></i>
            <h2>Payment Failed</h2>
            <p>Oops! Something went wrong while processing your payment. Please check your details and try again.</p>
            
            <div class="action-btns">
                <a href="payment.html" class="btn btn-primary">Try Again</a>
                <a href="contact.html" class="btn btn-outline">Contact Support</a>
            </div>
        </div>
    </main>

</body>
</html>
