<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Ghorer Bazar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .orders-section { padding: 40px 0; min-height: 70vh; }
        .orders-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; }
        .orders-header h2 { font-size: 1.8rem; }
        
        .order-card { background: var(--bg-card); border-radius: var(--border-radius); padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); margin-bottom: 20px; transition: var(--transition); }
        .order-card:hover { box-shadow: var(--shadow-md); border-color: var(--primary-light); }
        
        .order-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--border-color); padding-bottom: 15px; margin-bottom: 15px; }
        .order-id { font-weight: 700; color: var(--primary-color); font-size: 1.1rem; }
        .order-date { color: var(--text-muted); font-size: 0.9rem; }
        
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-processing { background: #cce5ff; color: #004085; }
        .status-shipped { background: #d4edda; color: #155724; }
        .status-delivered { background: var(--primary-color); color: var(--white); }
        .status-cancelled { background: var(--danger); color: var(--white); }
        
        .order-body { display: flex; justify-content: space-between; align-items: center; }
        .order-info p { margin-bottom: 5px; font-size: 0.95rem; }
        .order-total { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }
        
        .order-actions { margin-top: 15px; text-align: right; }
        
        .no-orders { text-align: center; padding: 60px 20px; }
        .no-orders i { font-size: 5rem; color: #ddd; margin-bottom: 20px; }
        .no-orders h3 { color: var(--text-muted); }
        
        @media (max-width: 600px) {
            .order-top, .order-body { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <div class="logo"><a href="index.html"><h2>Ghorer<span>Bazar</span></h2></a></div>
            <div class="nav-icons">
                <a href="profile.html" class="icon-link" title="Profile"><i class="fas fa-user-circle"></i></a>
            </div>
        </div>
    </header>

    <main class="container orders-section">
        <div class="orders-header">
            <h2>My Orders History</h2>
            <a href="index.html" class="btn btn-outline">Continue Shopping</a>
        </div>
        
        <div id="orders-container">
            <!-- Skeleton Loader -->
            <div class="skeleton-card" style="height: 150px; margin-bottom: 20px;"></div>
            <div class="skeleton-card" style="height: 150px; margin-bottom: 20px;"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/order.js"></script>
</body>
</html>
