<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Ghorer Bazar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .checkout-section { padding: 40px 0; min-height: 60vh; }
        .checkout-header { font-size: 1.8rem; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        
        .checkout-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .checkout-form-wrapper { background: var(--bg-card); border-radius: var(--border-radius); padding: 30px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); }
        .checkout-form-wrapper h3 { margin-bottom: 20px; font-size: 1.3rem; border-bottom: 1px solid var(--bg-main); padding-bottom: 10px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--text-main); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; transition: var(--transition);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary-color); outline: none; }
        
        .delivery-charge-box {
            display: flex; gap: 20px; margin-top: 10px;
        }
        .delivery-option {
            flex: 1; border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: var(--transition);
        }
        .delivery-option:hover { border-color: var(--primary-color); }
        .delivery-option.active { border-color: var(--primary-color); background: rgba(46, 125, 50, 0.05); }

        .checkout-summary { background: var(--bg-card); border-radius: var(--border-radius); padding: 25px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); height: fit-content; position: sticky; top: 90px; }
        .checkout-summary h3 { margin-bottom: 20px; font-size: 1.3rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.95rem; }
        .summary-item-title { color: var(--text-muted); max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .summary-divider { height: 1px; background: var(--border-color); margin: 15px 0; }
        
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--text-main); font-weight: 500; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 15px; border-top: 2px dashed var(--border-color); font-size: 1.3rem; font-weight: 700; color: var(--primary-color); }

        @media (max-width: 768px) {
            .checkout-container { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .delivery-charge-box { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <div class="logo"><a href="index.html"><h2>Ghorer<span>Bazar</span></h2></a></div>
            <div class="nav-icons">
                <a href="cart.html" class="icon-link"><i class="fas fa-shopping-cart"></i></a>
            </div>
        </div>
    </header>

    <main class="container checkout-section">
        <h2 class="checkout-header">Checkout Information</h2>
        
        <form id="checkout-form" class="checkout-container">
            <div class="checkout-form-wrapper">
                <h3>Delivery Address</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="c-name">Full Name *</label>
                        <input type="text" id="c-name" required placeholder="Receiver's Name">
                    </div>
                    <div class="form-group">
                        <label for="c-phone">Phone Number *</label>
                        <input type="tel" id="c-phone" required placeholder="01XXXXXXXXX" pattern="[0-9]{11}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="c-district">District *</label>
                        <select id="c-district" required>
                            <option value="">Select District</option>
                            <option value="Dhaka">Dhaka (Inside)</option>
                            <option value="Outside Dhaka">Outside Dhaka</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="c-upazila">Upazila / Area *</label>
                        <input type="text" id="c-upazila" required placeholder="e.g. Dhanmondi / Savar">
                    </div>
                </div>

                <div class="form-group">
                    <label for="c-address">Detailed Address *</label>
                    <textarea id="c-address" rows="3" required placeholder="House, Road, Block, Area details"></textarea>
                </div>

                <div class="form-group">
                    <label for="c-notes">Order Notes (Optional)</label>
                    <textarea id="c-notes" rows="2" placeholder="Any special instructions for delivery?"></textarea>
                </div>

                <h3>Delivery Method</h3>
                <div class="delivery-charge-box" id="delivery-methods">
                    <label class="delivery-option" id="inside-dhaka-opt">
                        <input type="radio" name="deliveryCharge" value="70" required>
                        <div>
                            <strong>Inside Dhaka</strong>
                            <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">2-3 Days Delivery (৳70)</p>
                        </div>
                    </label>
                    <label class="delivery-option" id="outside-dhaka-opt">
                        <input type="radio" name="deliveryCharge" value="130">
                        <div>
                            <strong>Outside Dhaka</strong>
                            <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">3-5 Days Delivery (৳130)</p>
                        </div>
                    </label>
                </div>
            </div>
            
            <div class="checkout-summary">
                <h3>Order Summary</h3>
                <div id="checkout-items-list">
                    <!-- Items injected here -->
                </div>
                
                <div class="summary-divider"></div>
                
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="c-subtotal">৳0</span>
                </div>
                <div class="summary-row">
                    <span>Delivery Charge</span>
                    <span id="c-delivery-charge">৳0</span>
                </div>
                <div class="summary-total">
                    <span>Total Payable</span>
                    <span id="c-total">৳0</span>
                </div>
                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 25px; font-size:1.1rem; padding: 14px;" id="continue-payment-btn">Continue to Payment <i class="fas fa-arrow-right" style="margin-left: 5px;"></i></button>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/checkout.js"></script>
</body>
</html>
