<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart Bag - Ghorer Bazar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .cart-section { padding: 40px 0 100px 0; }
        .cart-header { border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 30px; font-size: 1.8rem; text-transform: uppercase; font-weight: 700; letter-spacing: -0.5px;}
        
        .cart-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }
        
        .cart-item { display: flex; gap: 20px; background: var(--white); padding: 20px; border-radius: var(--border-radius); border: 1px solid var(--border-color); margin-bottom: 20px; position: relative;}
        .cart-item-img { width: 100px; height: 120px; object-fit: cover; border-radius: 4px; background: #fafafa;}
        .cart-item-details { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .cart-item-title { font-weight: 600; font-size: 1.1rem; color: var(--primary-color); }
        .cart-item-meta { font-size: 0.85rem; color: var(--text-muted); margin-top: 5px; }
        .cart-item-meta span { background: #f0f0f0; padding: 2px 8px; border-radius: 4px; font-weight: 600; color: #333; margin-right: 5px; }
        .cart-item-price { font-weight: 700; color: var(--primary-color); margin-top: 8px; }
        
        .cart-qty-control { display: flex; align-items: center; gap: 10px; background: var(--bg-main); padding: 5px; border-radius: 4px; width: fit-content; margin-top: 10px;}
        .cart-qty-btn { background: #fff; border: 1px solid var(--border-color); width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; border-radius: 4px;}
        .cart-qty-input { width: 35px; border: none; text-align: center; font-weight: 700; background: transparent; outline: none;}
        
        .item-remove { position: absolute; top: 20px; right: 20px; color: var(--danger); background: transparent; border: none; cursor: pointer; font-size: 1.1rem; transition: 0.2s;}
        .item-remove:hover { transform: scale(1.1); }

        .summary-card { background: var(--white); border-radius: var(--border-radius); padding: 30px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); height: fit-content; position: sticky; top: 100px; }
        .summary-card h3 { font-size: 1.3rem; margin-bottom: 20px; text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .row-summary { display: flex; justify-content: space-between; margin-bottom: 15px; color: var(--text-muted); font-weight: 500;}
        .total-summary { display: flex; justify-content: space-between; margin-top: 25px; padding-top: 15px; border-top: 2px dashed var(--border-color); font-size: 1.25rem; font-weight: 700; color: var(--primary-color); }
        
        .empty-bag { text-align: center; padding: 60px 20px; }
        .empty-bag i { font-size: 5rem; color: #ddd; margin-bottom: 20px; }

        @media (max-width: 992px) {
            .cart-grid { grid-template-columns: 1fr; }
            .cart-item { flex-direction: column; align-items: center; text-align: center; }
            .cart-qty-control { margin: 15px auto 0 auto; }
            .item-remove { top: 15px; right: 15px; }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <p>Fashion Mega Sale: Free Delivery on orders over ৳2000! 🛍️</p>
    </div>

    <!-- Header & Navbar -->
    <header class="header">
        <div class="container navbar">
            <div class="logo">
                <a href="index.html">
                    <h2>Ghorer<span>Bazar</span></h2>
                </a>
            </div>

            <div class="search-bar">
                <form id="search-form" onsubmit="event.preventDefault(); window.location.href=`search.html?q=${encodeURIComponent(document.getElementById('search-input').value.trim())}`;">
                    <input type="text" id="search-input" placeholder="Search T-shirts, Jeans, Hoodies...">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>

            <div class="nav-icons">
                <a href="wishlist.html" class="icon-link" title="Wishlist">
                    <i class="far fa-heart"></i>
                    <span id="wishlist-badge" class="badge" style="display:none;">0</span>
                </a>
                <a href="cart.html" class="icon-link" title="Cart">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cart-badge" class="badge" style="display:none;">0</span>
                </a>
                <div class="user-dropdown">
                    <a href="login.html" class="icon-link" id="user-icon" title="Profile">
                        <i class="far fa-user"></i>
                    </a>
                    <div class="dropdown-content" id="user-dropdown-content" style="display: none;">
                        <a href="profile.html"><i class="fas fa-user-circle"></i> My Profile</a>
                        <a href="my-orders.html"><i class="fas fa-box"></i> My Orders</a>
                        <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="category.html"><i class="fas fa-th-large"></i><span>Category</span></a>
        <a href="cart.html" class="active"><i class="fas fa-shopping-bag"></i><span id="mobile-cart-badge" class="badge" style="display: none;">0</span><span>Cart</span></a>
        <a href="profile.html"><i class="far fa-user"></i><span>Profile</span></a>
    </nav>

    <!-- Main Container -->
    <main class="container cart-section">
        <h2 class="cart-header">Your Shopping Bag</h2>
        
        <div class="cart-grid" id="cart-content" style="display: none;">
            <div id="cart-items-container">
                <!-- Cart Items will be dynamically loaded here by cart.js -->
            </div>
            
            <div class="summary-card">
                <h3>Order Summary</h3>
                <div class="row-summary">
                    <span>Items Total (<span id="total-items">0</span>)</span>
                    <span id="subtotal-amount">৳0</span>
                </div>
                <div class="row-summary" style="font-size:0.85rem; color:var(--secondary-color);">
                    <span>Delivery Fee</span>
                    <span>Calculated at checkout</span>
                </div>
                <div class="total-summary">
                    <span>Subtotal</span>
                    <span id="total-amount">৳0</span>
                </div>
                <button class="btn btn-primary btn-block" style="margin-top: 20px; font-size:1rem; padding:15px;" id="checkout-btn">Proceed to Checkout</button>
            </div>
        </div>

        <div class="empty-bag" id="empty-cart-msg">
            <i class="fas fa-shopping-bag" style="font-size: 5rem; color: #ddd; margin-bottom: 20px;"></i>
            <h3>Your Shopping Bag is empty</h3>
            <a href="index.html" class="btn btn-primary" style="margin-top:20px;">Shop New Collection</a>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
    <script type="module" src="assets/js/cart.js"></script>
</body>
</html>
