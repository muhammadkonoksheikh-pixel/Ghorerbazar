<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Ghorer Bazar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .profile-section {
            padding: 40px 0 100px 0; /* Extra bottom padding for mobile navbar */
            min-height: 70vh;
        }
        .profile-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }
        /* Sidebar */
        .profile-sidebar {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            padding: 30px 20px;
            text-align: center;
            border: 1px solid var(--border-color);
            height: fit-content;
        }
        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--bg-main);
            box-shadow: var(--shadow-md);
            margin-bottom: 15px;
        }
        .profile-sidebar h3 {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }
        .profile-sidebar p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .profile-nav {
            display: flex;
            flex-direction: column;
            text-align: left;
            gap: 5px;
        }
        .profile-nav a {
            padding: 12px 15px;
            border-radius: 8px;
            color: var(--text-main);
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-nav a:hover, .profile-nav a.active {
            background: var(--bg-main);
            color: var(--primary-color);
        }
        /* Main Content */
        .profile-content {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            padding: 30px;
            border: 1px solid var(--border-color);
        }
        .profile-content h2 {
            border-bottom: 2px solid var(--bg-main);
            padding-bottom: 15px;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            transition: var(--transition);
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        /* Logged Out Container style */
        .logged-out-card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            padding: 50px 30px;
            text-align: center;
            max-width: 500px;
            margin: 60px auto;
            border: 1px solid var(--border-color);
        }
        .logged-out-card i {
            font-size: 4rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .logged-out-card h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }
        .logged-out-card p {
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .logged-out-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <!-- Header & Navbar -->
    <header class="header">
        <div class="container navbar">
            <div class="logo">
                <a href="index.html">
                    <h2>Ghorer<span>Bazar</span></h2>
                </a>
            </div>

            <div class="search-bar">
                <form id="search-form" onsubmit="event.preventDefault(); window.location.href=`search.html?q=${encodeURIComponent(document.getElementById('search-input').value.trim())}`;">
                    <input type="text" id="search-input" placeholder="Search T-shirts, Jeans, Hoodies...">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>

            <div class="nav-icons">
                <a href="wishlist.html" class="icon-link" title="Wishlist">
                    <i class="far fa-heart"></i>
                    <span id="wishlist-badge" class="badge" style="display:none;">0</span>
                </a>
                <a href="cart.html" class="icon-link" title="Cart">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cart-badge" class="badge" style="display:none;">0</span>
                </a>
                <div class="user-dropdown">
                    <a href="login.html" class="icon-link" id="user-icon" title="Profile">
                        <i class="far fa-user"></i>
                    </a>
                    <div class="dropdown-content" id="user-dropdown-content" style="display: none;">
                        <a href="profile.html"><i class="fas fa-user-circle"></i> My Profile</a>
                        <a href="my-orders.html"><i class="fas fa-box"></i> My Orders</a>
                        <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="category.html"><i class="fas fa-th-large"></i><span>Category</span></a>
        <a href="cart.html"><i class="fas fa-shopping-bag"></i><span id="mobile-cart-badge" class="badge" style="display: none;">0</span><span>Cart</span></a>
        <a href="profile.html" class="active"><i class="far fa-user"></i><span>Profile</span></a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/profile.js"></script>
</body>
</html>
