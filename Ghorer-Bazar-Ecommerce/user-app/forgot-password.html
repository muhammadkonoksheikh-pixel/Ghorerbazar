<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Ghorer Bazar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-container {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f6f9fc 0%, #eef2f5 100%);
            padding: 20px;
        }
        .auth-card {
            background: var(--white);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        .auth-icon {
            font-size: 4rem;
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        .auth-card h2 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 10px;
        }
        .auth-card p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: var(--transition);
        }
        .form-group input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-muted);
            font-weight: 500;
            transition: var(--transition);
        }
        .back-link:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <i class="fas fa-lock auth-icon"></i>
            <h2>Reset Password</h2>
            <p>Enter your registered email address and we'll send you a link to reset your password.</p>

            <form id="reset-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                <button type="submit" class="btn btn-primary auth-btn" id="reset-btn">
                    Send Reset Link <i class="fas fa-paper-plane"></i>
                </button>
            </form>

            <a href="login.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
        import { auth } from './assets/js/firebase-config.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const resetBtn = document.getElementById('reset-btn');

            resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            resetBtn.disabled = true;

            try {
                await sendPasswordResetEmail(auth, email);
                Swal.fire({
                    icon: 'success',
                    title: 'Email Sent!',
                    text: 'Check your inbox for the password reset link.',
                    confirmButtonColor: '#2e7d32'
                }).then(() => {
                    window.location.href = 'login.html';
                });
            } catch (error) {
                Swal.fire('Error', error.message.replace('Firebase:', '').trim(), 'error');
                resetBtn.innerHTML = 'Send Reset Link <i class="fas fa-paper-plane"></i>';
                resetBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
