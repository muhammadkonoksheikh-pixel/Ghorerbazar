<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Ghorer Bazar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .category-page-header { background: var(--primary-dark); color: var(--white); padding: 40px 0; text-align: center; margin-bottom: 40px; }
        .category-page-header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        
        .cat-container { display: grid; grid-template-columns: 250px 1fr; gap: 30px; margin-bottom: 50px; }
        
        .sidebar-filter { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 20px; height: fit-content; position: sticky; top: 90px; }
        .sidebar-filter h3 { margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .cat-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .cat-list li { cursor: pointer; transition: var(--transition); color: var(--text-muted); font-weight: 500; }
        .cat-list li:hover, .cat-list li.active { color: var(--primary-color); padding-left: 5px; }

        @media (max-width: 768px) {
            .cat-container { grid-template-columns: 1fr; }
            .sidebar-filter { position: static; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container navbar">
            <div class="logo"><a href="index.html"><h2>Ghorer<span>Bazar</span></h2></a></div>
            <div class="search-bar" style="flex:1; max-width:400px; margin-left: auto;">
                <form id="top-search-form">
                    <input type="text" id="top-search-input" placeholder="Search products...">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>
            <div class="nav-icons" style="margin-left: 20px;">
                <a href="cart.html" class="icon-link"><i class="fas fa-shopping-cart"></i></a>
            </div>
        </div>
    </header>

    <div class="category-page-header">
        <div class="container">
            <h1 id="page-cat-title">All Products</h1>
            <p>Browse through our premium quality collections</p>
        </div>
    </div>

    <main class="container cat-container">
        <aside class="sidebar-filter">
            <h3>Categories</h3>
            <ul class="cat-list" id="sidebar-cat-list">
                <li>Loading categories...</li>
            </ul>
        </aside>

        <section>
            <div class="product-grid" id="cat-product-grid">
                <!-- Skeletons -->
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
            <div id="no-products-msg" style="display:none; text-align:center; padding: 50px; color: var(--text-muted);">
                <i class="fas fa-box-open" style="font-size: 4rem; color: #ddd; margin-bottom: 15px;"></i>
                <h3>No products found in this category.</h3>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/category.js"></script>
    <script>
        document.getElementById('top-search-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const q = document.getElementById('top-search-input').value.trim();
            if(q) window.location.href = `search.html?q=${encodeURIComponent(q)}`;
        });
    </script>
</body>
</html>
