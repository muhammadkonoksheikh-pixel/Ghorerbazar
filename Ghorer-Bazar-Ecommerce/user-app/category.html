<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Ghorer Bazar Fashion</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .category-page-header { background: var(--primary-dark); color: var(--white); padding: 40px 0; text-align: center; margin-bottom: 40px; }
        .category-page-header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        
        .cat-container { display: grid; grid-template-columns: 250px 1fr; gap: 30px; margin-bottom: 50px; }
        
        .sidebar-filter { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 20px; height: fit-content; position: sticky; top: 90px; }
        .sidebar-filter h3 { margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; text-transform: uppercase; font-size: 1rem; letter-spacing: 1px;}
        .cat-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .cat-list li { cursor: pointer; transition: var(--transition); color: var(--text-muted); font-weight: 500; }
        .cat-list li:hover, .cat-list li.active { color: var(--primary-color); padding-left: 5px; font-weight: 600;}

        @media (max-width: 768px) {
            .cat-container { grid-template-columns: 1fr; }
            .sidebar-filter { position: static; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <p>Fashion Mega Sale: Free Delivery on orders over ৳2000! 🛍️</p>
    </div>

    <!-- Header & Navbar -->
    <header class="header">
        <div class="container navbar">
            <div class="logo">
                <a href="index.html">
                    <h2>Ghorer<span>Bazar</span></h2>
                </a>
            </div>

            <div class="search-bar">
                <form id="search-form" onsubmit="event.preventDefault(); window.location.href=`search.html?q=${encodeURIComponent(document.getElementById('search-input').value.trim())}`;">
                    <input type="text" id="search-input" placeholder="Search T-shirts, Jeans, Hoodies...">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>

            <div class="nav-icons">
                <a href="wishlist.html" class="icon-link" title="Wishlist">
                    <i class="far fa-heart"></i>
                    <span id="wishlist-badge" class="badge" style="display:none;">0</span>
                </a>
                <a href="cart.html" class="icon-link" title="Cart">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="cart-badge" class="badge" style="display:none;">0</span>
                </a>
                <div class="user-dropdown">
                    <a href="login.html" class="icon-link" id="user-icon" title="Profile">
                        <i class="far fa-user"></i>
                    </a>
                    <div class="dropdown-content" id="user-dropdown-content" style="display: none;">
                        <a href="profile.html"><i class="fas fa-user-circle"></i> My Profile</a>
                        <a href="my-orders.html"><i class="fas fa-box"></i> My Orders</a>
                        <a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="category.html" class="active"><i class="fas fa-th-large"></i><span>Category</span></a>
        <a href="cart.html"><i class="fas fa-shopping-bag"></i><span id="mobile-cart-badge" class="badge" style="display: none;">0</span><span>Cart</span></a>
        <a href="profile.html"><i class="far fa-user"></i><span>Profile</span></a>
    </nav>

    <!-- Banner Header -->
    <div class="category-page-header">
        <div class="container">
            <h1 id="page-cat-title">All Products</h1>
            <p>Browse through our premium quality collections</p>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container cat-container">
        <aside class="sidebar-filter">
            <h3>Categories</h3>
            <ul class="cat-list" id="sidebar-cat-list">
                <li>Loading categories...</li>
            </ul>
        </aside>

        <section>
            <div class="product-grid" id="cat-product-grid">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
            <div id="no-products-msg" style="display:none; text-align:center; padding: 50px; color: var(--text-muted);">
                <i class="fas fa-box-open" style="font-size: 4rem; color: #ddd; margin-bottom: 15px;"></i>
                <h3>No products found in this category.</h3>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/auth.js"></script>
    <script type="module" src="assets/js/category.js"></script>
</body>
</html>
