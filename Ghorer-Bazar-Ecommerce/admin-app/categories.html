<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <style>
        .cat-img-td { width: 50px; height: 50px; object-fit: contain; background: #f8f9fa; border-radius: 6px; padding: 5px; border: 1px solid var(--border); }
        .row-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        @media(max-width: 768px) { .row-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Ghorer<span>Bazar</span></h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="orders.html"><i class="fas fa-shopping-cart"></i> Orders</a></li>
                <li><a href="products.html"><i class="fas fa-box"></i> Products</a></li>
                <li><a href="categories.html" class="active"><i class="fas fa-list"></i> Categories</a></li>
                <li><a href="users.html"><i class="fas fa-users"></i> Customers</a></li>
                <li><a href="banners.html"><i class="fas fa-images"></i> Banners</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></div>
                <div class="topbar-right">
                    <div class="admin-profile"><span id="admin-name">Admin</span></div>
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <h2>Manage Categories</h2>
                </div>

                <div class="row-grid">
                    <!-- Add Category Form -->
                    <div class="card" style="height: fit-content;">
                        <div class="card-title">Add New Category</div>
                        <form id="add-cat-form">
                            <div class="form-group">
                                <label>Category Name</label>
                                <input type="text" id="c-name" class="form-control" required placeholder="e.g. Honey & Ghee">
                            </div>
                            <div class="form-group">
                                <label>Category Image (Upload directly to Cloudinary)</label>
                                <input type="file" id="c-image" class="form-control" accept="image/*" required>
                                <p style="font-size:0.8rem; color:#777; margin-top:5px;">Transparent PNG recommended.</p>
                            </div>
                            <div class="form-group">
                                <label>Display Order (Priority)</label>
                                <input type="number" id="c-order" class="form-control" required value="1">
                            </div>
                            <button type="submit" class="btn btn-primary" id="cat-submit-btn" style="width:100%; justify-content:center;">Add Category</button>
                        </form>
                    </div>

                    <!-- Category List -->
                    <div class="card">
                        <div class="card-title">All Categories</div>
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Image</th>
                                    <th>Name</th>
                                    <th>Order</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="cat-list">
                                <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/admin-auth.js"></script>
    <script type="module">
        import { db } from './assets/js/firebase-config.js';
        import { collection, getDocs, addDoc, deleteDoc, doc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/dtmvxrmwg/image/upload';
        const UPLOAD_PRESET = 'ghorer_bazar_preset';

        const catForm = document.getElementById('add-cat-form');
        const submitBtn = document.getElementById('cat-submit-btn');
        const listBody = document.getElementById('cat-list');

        document.addEventListener('DOMContentLoaded', loadCategories);

        async function loadCategories() {
            try {
                const q = query(collection(db, "categories"), orderBy("order", "asc"));
                const snapshot = await getDocs(q);
                
                if(snapshot.empty) {
                    listBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No categories found.</td></tr>';
                    return;
                }

                let html = '';
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    html += `
                        <tr>
                            <td><img src="${data.image || '../user-app/assets/images/placeholder.jpg'}" class="cat-img-td"></td>
                            <td><strong>${data.name}</strong></td>
                            <td>${data.order || 0}</td>
                            <td>
                                <button class="btn btn-danger btn-delete-cat" data-id="${docSnap.id}" style="padding: 5px 10px;"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
                listBody.innerHTML = html;

                // Delete Logic
                document.querySelectorAll('.btn-delete-cat').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.currentTarget.getAttribute('data-id');
                        if(confirm('Are you sure you want to delete this category?')) {
                            await deleteDoc(doc(db, "categories", id));
                            loadCategories();
                        }
                    });
                });

            } catch(e) {
                console.error(e);
                listBody.innerHTML = '<tr><td colspan="4" style="color:red;text-align:center;">Error loading data.</td></tr>';
            }
        }

        catForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('c-image').files[0];
            
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
            submitBtn.disabled = true;

            try {
                // Upload Image
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', UPLOAD_PRESET);
                formData.append('folder', 'categories');

                const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
                const data = await res.json();

                if (!data.secure_url) throw new Error('Image upload failed');

                // Save to Firestore
                await addDoc(collection(db, "categories"), {
                    name: document.getElementById('c-name').value.trim(),
                    image: data.secure_url,
                    order: parseInt(document.getElementById('c-order').value)
                });

                Swal.fire('Success', 'Category added successfully', 'success');
                catForm.reset();
                loadCategories();
            } catch (error) {
                Swal.fire('Error', error.message, 'error');
            } finally {
                submitBtn.innerHTML = 'Add Category';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
