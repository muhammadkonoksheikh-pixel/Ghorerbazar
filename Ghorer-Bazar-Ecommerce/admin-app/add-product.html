<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <style>
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .variant-card {
            background: #f8f9fa;
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
        }
        .variant-card .remove-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .sizes-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 15px;
        }
        .sizes-row div {
            text-align: center;
        }
        .sizes-row label {
            font-size: 0.85rem;
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }
        .sizes-row input {
            text-align: center;
        }
        .preview-img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); margin-top: 10px; display: none; }
        .switch-container { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Ghorer<span>Bazar</span></h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="orders.html"><i class="fas fa-shopping-cart"></i> Orders</a></li>
                <li><a href="products.html" class="active"><i class="fas fa-box"></i> Products</a></li>
                <li><a href="categories.html"><i class="fas fa-list"></i> Categories</a></li>
                <li><a href="users.html"><i class="fas fa-users"></i> Customers</a></li>
                <li><a href="banners.html"><i class="fas fa-images"></i> Banners</a></li>
                <li><a href="#" id="admin-logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></div>
                <div class="topbar-right">
                    <div class="admin-profile"><span id="admin-name">Admin</span></div>
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <h2>Add New Product</h2>
                    <a href="products.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
                </div>

                <div class="card">
                    <form id="add-product-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Product Name *</label>
                                <input type="text" id="p-name" class="form-control" required placeholder="e.g. Premium Cotton Slim Fit Shirt">
                            </div>
                            <div class="form-group">
                                <label>Category *</label>
                                <select id="p-category" class="form-control" required>
                                    <option value="">Select Category</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Selling Price (৳) *</label>
                                <input type="number" id="p-price" class="form-control" required placeholder="0.00">
                            </div>
                            <div class="form-group">
                                <label>Old Price (৳) (Optional)</label>
                                <input type="number" id="p-old-price" class="form-control" placeholder="0.00">
                            </div>
                        </div>

                        <!-- Dynamic Color and Size Variants Area -->
                        <div style="margin-bottom: 25px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:10px;">
                                <h3 style="font-size:1.1rem; color:var(--primary);">Product Color & Size Stock</h3>
                                <button type="button" class="btn btn-primary" id="add-variant-btn" style="padding: 6px 12px; font-size:0.85rem;"><i class="fas fa-plus"></i> Add Color Variant</button>
                            </div>
                            <div id="variants-container">
                                <!-- Dynamic variant cards will be inserted here -->
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Product Description *</label>
                            <textarea id="p-desc" class="form-control" rows="5" required placeholder="Describe fabrics, stitching quality, fittings details..."></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group switch-container">
                                <input type="checkbox" id="p-featured" style="width:18px; height:18px;">
                                <label for="p-featured" style="margin-bottom:0;">Featured Product</label>
                            </div>
                            <div class="form-group switch-container">
                                <input type="checkbox" id="p-flash" style="width:18px; height:18px;">
                                <label for="p-flash" style="margin-bottom:0;">Add to Flash Sale</label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" id="submit-btn" style="width:100%; padding: 14px; margin-top:20px; justify-content:center; font-size:1.1rem;">
                            Save Product <i class="fas fa-save"></i>
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/admin-auth.js"></script>
    <script type="module">
        import { db } from './assets/js/firebase-config.js';
        import { collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Upgraded Cloudinary Credentials
        const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/dfiigto8h/image/upload';
        const UPLOAD_PRESET = 'ghorer_bazar_preset';

        const catSelect = document.getElementById('p-category');
        const variantsContainer = document.getElementById('variants-container');
        const addVariantBtn = document.getElementById('add-variant-btn');
        const form = document.getElementById('add-product-form');
        const submitBtn = document.getElementById('submit-btn');

        let variantCount = 0;

        // Load Categories
        async function loadCategories() {
            try {
                const snap = await getDocs(collection(db, "categories"));
                snap.forEach(doc => {
                    const opt = document.createElement('option');
                    opt.value = doc.id;
                    opt.text = doc.data().name;
                    opt.setAttribute('data-name', doc.data().name);
                    catSelect.appendChild(opt);
                });
            } catch (e) {
                console.error("Failed to load categories", e);
            }
        }
        loadCategories();

        // Add Dynamic Variant Card
        function addVariantCard() {
            variantCount++;
            const card = document.createElement('div');
            card.className = 'variant-card';
            card.id = `variant-${variantCount}`;
            card.innerHTML = `
                <button type="button" class="remove-btn" onclick="document.getElementById('variant-${variantCount}').remove()"><i class="fas fa-trash"></i> Remove</button>
                <div class="form-row">
                    <div class="form-group">
                        <label>Color Name *</label>
                        <input type="text" class="form-control var-color" required placeholder="e.g. Navy Blue">
                    </div>
                    <div class="form-group">
                        <label>Color Specific Image *</label>
                        <input type="file" class="form-control var-file" required accept="image/*" onchange="previewVariantImage(this, 'img-preview-${variantCount}')">
                        <img id="img-preview-${variantCount}" class="preview-img">
                    </div>
                </div>
                <div class="sizes-row">
                    <div>
                        <label>S Stock</label>
                        <input type="number" class="form-control var-s" value="0" min="0" required>
                    </div>
                    <div>
                        <label>M Stock</label>
                        <input type="number" class="form-control var-m" value="0" min="0" required>
                    </div>
                    <div>
                        <label>L Stock</label>
                        <input type="number" class="form-control var-l" value="0" min="0" required>
                    </div>
                    <div>
                        <label>XL Stock</label>
                        <input type="number" class="form-control var-xl" value="0" min="0" required>
                    </div>
                    <div>
                        <label>XXL Stock</label>
                        <input type="number" class="form-control var-xxl" value="0" min="0" required>
                    </div>
                </div>
            `;
            variantsContainer.appendChild(card);
        }

        // Global functions mapped for inline elements inside dynamic templates
        window.previewVariantImage = function(input, previewId) {
            const preview = document.getElementById(previewId);
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        };

        addVariantBtn.addEventListener('click', addVariantCard);
        
        // Add first variant card by default
        addVariantCard();

        // Form Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const cards = document.querySelectorAll('.variant-card');
            if (cards.length === 0) {
                Swal.fire('Error', 'Please add at least one color variant with stock.', 'error');
                return;
            }

            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing & Uploading...';
            submitBtn.disabled = true;

            try {
                const variantsData = [];
                const globalImages = []; // Maintain images array at root level for home page display fallbacks
                
                // Upload each variant image to Cloudinary asynchronously
                for (let card of cards) {
                    const colorName = card.querySelector('.var-color').value.trim();
                    const fileInput = card.querySelector('.var-file');
                    const file = fileInput.files[0];

                    // Sizes Mapping
                    const sStock = parseInt(card.querySelector('.var-s').value || 0);
                    const mStock = parseInt(card.querySelector('.var-m').value || 0);
                    const lStock = parseInt(card.querySelector('.var-l').value || 0);
                    const xlStock = parseInt(card.querySelector('.var-xl').value || 0);
                    const xxlStock = parseInt(card.querySelector('.var-xxl').value || 0);

                    // 1. Upload to Cloudinary
                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', UPLOAD_PRESET);
                    formData.append('folder', 'products');

                    const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
                    const data = await res.json();

                    if (!data.secure_url) {
                        throw new Error(`Upload failed for color variant: ${colorName}`);
                    }

                    globalImages.push(data.secure_url);

                    variantsData.push({
                        colorName: colorName,
                        imageUrl: data.secure_url,
                        sizes: {
                            S: sStock,
                            M: mStock,
                            L: lStock,
                            XL: xlStock,
                            XXL: xxlStock
                        }
                    });
                }

                // 2. Compute sizes totals for index product view fallbacks
                const totalSizesMap = { S: 0, M: 0, L: 0, XL: 0, XXL: 0 };
                variantsData.forEach(v => {
                    totalSizesMap.S += v.sizes.S;
                    totalSizesMap.M += v.sizes.M;
                    totalSizesMap.L += v.sizes.L;
                    totalSizesMap.XL += v.sizes.XL;
                    totalSizesMap.XXL += v.sizes.XXL;
                });

                const catOption = catSelect.options[catSelect.selectedIndex];

                // Save to Firestore
                const productData = {
                    name: document.getElementById('p-name').value.trim(),
                    categoryId: catSelect.value,
                    categoryName: catOption.getAttribute('data-name'),
                    price: parseFloat(document.getElementById('p-price').value),
                    oldPrice: document.getElementById('p-old-price').value ? parseFloat(document.getElementById('p-old-price').value) : null,
                    description: document.getElementById('p-desc').value.trim(),
                    images: globalImages,  // Fallback visual list
                    variants: variantsData, // Size/Color Mapping Object Array
                    sizes: totalSizesMap,  // Total sizes across all variants
                    isFeatured: document.getElementById('p-featured').checked,
                    isFlashSale: document.getElementById('p-flash').checked,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                };

                await addDoc(collection(db, "products"), productData);

                Swal.fire({
                    icon: 'success',
                    title: 'Saved!',
                    text: 'Clothing product successfully saved.'
                }).then(() => {
                    window.location.href = 'products.html';
                });

            } catch (error) {
                console.error(error);
                Swal.fire('Error', error.message, 'error');
                submitBtn.innerHTML = 'Save Product <i class="fas fa-save"></i>';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
