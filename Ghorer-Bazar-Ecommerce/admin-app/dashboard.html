<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Ghorer<span>Bazar</span></h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="orders.html"><i class="fas fa-shopping-cart"></i> Orders</a></li>
                <li><a href="products.html"><i class="fas fa-box"></i> Products</a></li>
                <li><a href="categories.html"><i class="fas fa-list"></i> Categories</a></li>
                <li><a href="users.html"><i class="fas fa-users"></i> Customers</a></li>
                <li><a href="banners.html"><i class="fas fa-images"></i> Banners</a></li>
                <li><a href="#" id="admin-logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="menu-toggle" id="menu-toggle">
                    <i class="fas fa-bars"></i>
                </div>
                <div class="topbar-right">
                    <div class="admin-profile">
                        <img src="../user-app/assets/images/default-avatar.png" alt="Admin">
                        <span id="admin-name" style="font-weight: 500;">Admin</span>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content">
                <div class="page-header">
                    <h2>Overview</h2>
                    <button class="btn btn-primary" onclick="window.location.href='add-product.html'"><i class="fas fa-plus"></i> Add Product</button>
                </div>

                <!-- Dashboard Cards -->
                <div class="dashboard-cards">
                    <div class="stat-card blue">
                        <div class="stat-icon blue"><i class="fas fa-shopping-bag"></i></div>
                        <div class="stat-info">
                            <h3 id="stat-orders">0</h3>
                            <p>Total Orders</p>
                        </div>
                    </div>
                    <div class="stat-card orange">
                        <div class="stat-icon orange"><i class="fas fa-box-open"></i></div>
                        <div class="stat-info">
                            <h3 id="stat-products">0</h3>
                            <p>Total Products</p>
                        </div>
                    </div>
                    <div class="stat-card green">
                        <div class="stat-icon green"><i class="fas fa-coins"></i></div>
                        <div class="stat-info">
                            <h3 id="stat-revenue">৳0</h3>
                            <p>Total Revenue</p>
                        </div>
                    </div>
                    <div class="stat-card red">
                        <div class="stat-icon red"><i class="fas fa-users"></i></div>
                        <div class="stat-info">
                            <h3 id="stat-users">0</h3>
                            <p>Total Customers</p>
                        </div>
                    </div>
                </div>

                <!-- Recent Orders Table -->
                <div class="card">
                    <div class="card-title">Recent Orders</div>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Amount</th>
                                <th>Payment</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="recent-orders-list">
                            <tr>
                                <td colspan="6" style="text-align: center;">Loading data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/admin-auth.js"></script>
    <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
