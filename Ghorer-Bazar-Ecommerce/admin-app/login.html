<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Ghorer Bazar</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/admin.css">
    <style>
        body {
            background: radial-gradient(circle at top right, #111e16 0%, #0c0f12 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* Glowing background blobs */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(46, 125, 50, 0.15);
            border-radius: 50%;
            top: -50px;
            right: -50px;
            filter: blur(80px);
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: rgba(255, 152, 0, 0.08);
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
            filter: blur(70px);
            z-index: 0;
        }
        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 45px 35px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
        }
        .login-header h2 {
            font-size: 2.2rem;
            color: #4caf50;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .login-header h2 span {
            color: #ff9800;
        }
        .login-header p {
            color: #8892b0;
            margin-bottom: 35px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 22px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #8892b0;
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-icon-wrap {
            position: relative;
        }
        .input-icon-wrap i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #556270;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .form-control {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 0.95rem;
            color: #e2e8f0;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: #4caf50;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.2);
        }
        .form-control:focus + i {
            color: #4caf50;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.2);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 125, 50, 0.3);
            background: linear-gradient(135deg, #388e3c 0%, #2e7d32 100%);
        }
        .security-badge {
            margin-top: 25px;
            color: #556270;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>Ghorer<span>Bazar</span></h2>
                <p>ADMIN CONTROL PANEL</p>
            </div>

            <!-- Form handles submit safely -->
            <form id="admin-login-form" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label>Admin Email</label>
                    <div class="input-icon-wrap">
                        <input type="email" id="email" class="form-control" required placeholder="admin@ghorerbazar.com">
                        <i class="far fa-envelope"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon-wrap">
                        <input type="password" id="password" class="form-control" required placeholder="••••••••">
                        <i class="fas fa-lock"></i>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="login-btn">
                    Secure Login <i class="fas fa-shield-alt"></i>
                </button>
            </form>

            <div class="security-badge">
                <i class="fas fa-lock"></i> Encrypted Administrator Session
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module">
    import { auth, db } from "./assets/js/firebase-config.js";

    import {
        signInWithEmailAndPassword,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    import {
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const form = document.getElementById("admin-login-form");
    const loginBtn = document.getElementById("login-btn");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        loginBtn.disabled = true;
        loginBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

        try {

            // Firebase Authentication Login
            const userCredential = await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            const user = userCredential.user;

            // Firestore Admin Check
            const adminRef = doc(db, "admins", user.uid);
            const adminSnap = await getDoc(adminRef);

            if (!adminSnap.exists()) {
                await signOut(auth);

                Swal.fire({
                    icon: "error",
                    title: "Access Denied",
                    text: "You are not an administrator.",
                    confirmButtonColor: "#2e7d32"
                });

                loginBtn.disabled = false;
                loginBtn.innerHTML =
                    'Secure Login <i class="fas fa-shield-alt"></i>';

                return;
            }

            const adminData = adminSnap.data();

            if (adminData.role !== "admin") {

                await signOut(auth);

                Swal.fire({
                    icon: "error",
                    title: "Access Denied",
                    text: "Invalid administrator permission.",
                    confirmButtonColor: "#2e7d32"
                });

                loginBtn.disabled = false;
                loginBtn.innerHTML =
                    'Secure Login <i class="fas fa-shield-alt"></i>';

                return;
            }

            Swal.fire({
                icon: "success",
                title: "Login Successful",
                text: "Welcome Admin!",
                timer: 1200,
                showConfirmButton: false
            });

            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 1200);

        } catch (error) {

            console.error(error);

            let message = "Login failed.";

            switch (error.code) {

                case "auth/invalid-credential":
                    message = "Incorrect email or password.";
                    break;

                case "auth/user-not-found":
                    message = "User not found.";
                    break;

                case "auth/wrong-password":
                    message = "Wrong password.";
                    break;

                case "auth/invalid-email":
                    message = "Invalid email address.";
                    break;

                case "auth/network-request-failed":
                    message = "Network error. Check your internet.";
                    break;

                case "auth/too-many-requests":
                    message =
                        "Too many failed attempts. Try again later.";
                    break;
            }

            Swal.fire({
                icon: "error",
                title: "Login Failed",
                text: message,
                confirmButtonColor: "#2e7d32"
            });

            loginBtn.disabled = false;
            loginBtn.innerHTML =
                'Secure Login <i class="fas fa-shield-alt"></i>';
        }
    });
</script>
</body>
</html>
