<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Ghorer Bazar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <style>
        .admin-login-body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-header h2 {
            color: var(--primary);
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .login-header h2 span {
            color: var(--secondary);
        }
        .login-header p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .form-group {
            text-align: left;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            margin-top: 10px;
            justify-content: center;
        }
    </style>
</head>
<body class="admin-login-body">

    <div class="login-card">
        <div class="login-header">
            <h2>Ghorer<span>Bazar</span></h2>
            <p>Admin Control Panel</p>
        </div>

        <form id="admin-login-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-control" required placeholder="admin@ghorerbazar.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-login" id="login-btn">
                Secure Login <i class="fas fa-lock"></i>
            </button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module" src="assets/js/admin-auth.js"></script>
    <script type="module">
        import { auth, db } from './assets/js/firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('login-btn');

            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            loginBtn.disabled = true;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Verify Admin
                const adminDoc = await getDoc(doc(db, "admins", user.uid));
                if (adminDoc.exists()) {
                    window.location.href = 'dashboard.html';
                } else {
                    throw new Error("Access Denied: Not an admin account.");
                }
            } catch (error) {
                // If not admin, the auth listener will sign them out anyway, but let's show an error
                Swal.fire('Login Failed', error.message.replace('Firebase:', '').trim(), 'error');
                loginBtn.innerHTML = 'Secure Login <i class="fas fa-lock"></i>';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
