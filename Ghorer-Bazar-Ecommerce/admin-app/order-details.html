<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <style>
        .details-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        
        .info-card { background: var(--bg-card); border-radius: var(--radius); padding: 25px; box-shadow: var(--shadow); margin-bottom: 30px; border: 1px solid var(--border); }
        .info-card h3 { border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; font-size: 1.2rem; color: var(--primary-dark); }
        
        .data-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; }
        .data-row span:first-child { color: var(--text-muted); font-weight: 500; }
        .data-row span:last-child { font-weight: 600; color: var(--text-main); text-align: right; }
        
        .item-list { border-top: 2px dashed var(--border); margin-top: 20px; padding-top: 20px; }
        .order-item { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .order-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #eee; }
        .order-item-info { flex: 1; }
        .order-item-title { font-weight: 600; margin-bottom: 5px; }
        
        .status-update-box { background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
        .status-update-box select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border); border-radius: 6px; }

        @media (max-width: 992px) {
            .details-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Ghorer<span>Bazar</span></h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="orders.html" class="active"><i class="fas fa-shopping-cart"></i> Orders</a></li>
                <li><a href="products.html"><i class="fas fa-box"></i> Products</a></li>
                <li><a href="categories.html"><i class="fas fa-list"></i> Categories</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="menu-toggle" id="menu-toggle"><i class="fas fa-bars"></i></div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <h2>Order <span id="display-order-id" style="color:var(--primary);">#...</span></h2>
                    <a href="orders.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
                </div>

                <div class="details-grid">
                    <div class="left-col">
                        <div class="info-card">
                            <h3>Items Ordered</h3>
                            <div id="ordered-items-container">
                                <!-- Items injected here -->
                                <div style="text-align:center;">Loading items...</div>
                            </div>
                        </div>

                        <div class="info-card">
                            <h3>Customer & Shipping Details</h3>
                            <div class="data-row"><span>Name:</span> <span id="od-name"></span></div>
                            <div class="data-row"><span>Phone:</span> <span id="od-phone"></span></div>
                            <div class="data-row"><span>Address:</span> <span id="od-address" style="max-width: 60%;"></span></div>
                            <div class="data-row"><span>Notes:</span> <span id="od-notes" style="color: var(--danger);"></span></div>
                        </div>
                    </div>

                    <div class="right-col">
                        <div class="info-card">
                            <h3>Payment Summary</h3>
                            <div class="data-row"><span>Subtotal:</span> <span id="od-subtotal"></span></div>
                            <div class="data-row"><span>Delivery Charge:</span> <span id="od-delivery"></span></div>
                            <div class="data-row" style="border-top: 2px dashed #ddd; padding-top:10px; margin-top:10px;">
                                <span>Total:</span> <span id="od-total" style="color:var(--primary); font-size:1.2rem;"></span>
                            </div>
                            <div class="data-row" style="margin-top:20px;"><span>Method:</span> <span id="od-method"></span></div>
                            <div class="data-row"><span>TrxID:</span> <span id="od-trx"></span></div>
                            
                            <div class="status-update-box" style="margin-top: 20px;">
                                <label style="font-weight:600; display:block; margin-bottom:5px;">Payment Status:</label>
                                <select id="update-pay-status">
                                    <option value="pending">Pending</option>
                                    <option value="paid">Paid</option>
                                    <option value="unpaid">Unpaid (COD)</option>
                                    <option value="failed">Failed / Invalid</option>
                                </select>
                                
                                <label style="font-weight:600; display:block; margin-bottom:5px; margin-top:15px;">Order Status:</label>
                                <select id="update-order-status">
                                    <option value="Pending">Pending</option>
                                    <option value="Confirmed">Confirmed</option>
                                    <option value="Processing">Processing</option>
                                    <option value="Packed">Packed</option>
                                    <option value="Shipped">Shipped</option>
                                    <option value="Delivered">Delivered</option>
                                    <option value="Cancelled">Cancelled</option>
                                </select>

                                <button class="btn btn-primary" id="btn-update-status" style="width:100%; margin-top:15px;">Update Status</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/admin-auth.js"></script>
    <script type="module">
        import { db } from './assets/js/firebase-config.js';
        import { doc, getDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        const orderDocId = urlParams.get('id');

        if(!orderDocId) window.location.href = 'orders.html';

        const updateBtn = document.getElementById('btn-update-status');

        document.addEventListener('DOMContentLoaded', loadOrderDetails);

        async function loadOrderDetails() {
            try {
                const docRef = doc(db, "orders", orderDocId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    Swal.fire('Error', 'Order not found', 'error').then(()=>window.location.href='orders.html');
                    return;
                }

                const data = docSnap.data();
                
                document.getElementById('display-order-id').innerText = `#${data.orderId}`;
                document.getElementById('od-name').innerText = data.customerName;
                document.getElementById('od-phone').innerText = data.customerPhone;
                document.getElementById('od-address').innerText = data.shippingAddress;
                document.getElementById('od-notes').innerText = data.notes || 'N/A';
                
                document.getElementById('od-subtotal').innerText = `৳${data.subtotal}`;
                document.getElementById('od-delivery').innerText = `৳${data.deliveryCharge}`;
                document.getElementById('od-total').innerText = `৳${data.totalAmount}`;
                
                document.getElementById('od-method').innerText = data.paymentMethod;
                document.getElementById('od-trx').innerText = data.transactionId || 'N/A';
                
                document.getElementById('update-pay-status').value = data.paymentStatus;
                document.getElementById('update-order-status').value = data.orderStatus;

                // Load Order Items
                const itemsQ = query(collection(db, "order_items"), where("orderDocId", "==", orderDocId));
                const itemsSnap = await getDocs(itemsQ);
                
                let itemsHtml = '';
                itemsSnap.forEach(itemDoc => {
                    const item = itemDoc.data();
                    itemsHtml += `
                        <div class="order-item">
                            <img src="${item.image}" alt="${item.name}">
                            <div class="order-item-info">
                                <div class="order-item-title">${item.name}</div>
                                <div><span style="color:var(--primary); font-weight:600;">৳${item.price}</span> x ${item.quantity}</div>
                            </div>
                            <div style="font-weight:700;">৳${item.price * item.quantity}</div>
                        </div>
                    `;
                });
                
                document.getElementById('ordered-items-container').innerHTML = itemsHtml || '<p>No items found.</p>';

            } catch (error) {
                console.error(error);
                Swal.fire('Error', 'Failed to load details', 'error');
            }
        }

        updateBtn.addEventListener('click', async () => {
            updateBtn.innerHTML = 'Updating...';
            updateBtn.disabled = true;
            
            const payStat = document.getElementById('update-pay-status').value;
            const ordStat = document.getElementById('update-order-status').value;

            try {
                await updateDoc(doc(db, "orders", orderDocId), {
                    paymentStatus: payStat,
                    orderStatus: ordStat
                });
                Swal.fire({icon: 'success', title: 'Updated!', toast: true, position: 'top-end', timer: 2000, showConfirmButton: false});
            } catch (error) {
                Swal.fire('Error', error.message, 'error');
            } finally {
                updateBtn.innerHTML = 'Update Status';
                updateBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
